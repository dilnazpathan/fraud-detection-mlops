
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/predictions.db
    volumes:
      - predictions_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fraud-detection-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  predictions_data:
